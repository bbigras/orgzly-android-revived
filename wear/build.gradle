apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

android {
    namespace = 'com.orgzly.wear'

    compileSdk 36

    defaultConfig {
        minSdkVersion 26
        targetSdkVersion 34
        versionCode 1
        versionName "1.0.0"
        applicationId = "com.orgzlyrevived"
    }

    buildFeatures {
        compose = true
        buildConfig = true
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }

        debug {
            buildConfigField "boolean", "LOG_DEBUG", "true"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = 17
    }
}

dependencies {
    // Wear OS
    implementation "com.google.android.gms:play-services-wearable:$versions.play_services_wearable"

    // Complication data source
    implementation "androidx.wear.watchface:watchface-complications-data-source-ktx:$versions.wear_watchface_complications"

    // Compose for Wear OS
    def composeBom = platform("androidx.compose:compose-bom:$versions.compose")
    implementation composeBom
    implementation "androidx.wear.compose:compose-material:$versions.wear_compose"
    implementation "androidx.wear.compose:compose-foundation:$versions.wear_compose"
    implementation "androidx.wear.compose:compose-navigation:$versions.compose_wear_navigation"
    implementation "androidx.activity:activity-compose:$versions.compose_activity"

    // Kotlin coroutines
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:$versions.kotlin_coroutines"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-play-services:$versions.kotlin_coroutines"

    // Gson for JSON serialization
    implementation "com.google.code.gson:gson:$versions.gson"
}
